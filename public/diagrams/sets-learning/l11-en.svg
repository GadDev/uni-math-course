<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title"><title id="title">One test, two quantifiers</title><rect width="600" height="260" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#111"><text x="300" y="30" font-size="24" text-anchor="middle">One test, two quantifiers</text><rect x="40" y="60" width="160" height="95" rx="6" fill="#fffdf8" stroke="#222"/><text x="120" y="90" font-size="20" text-anchor="middle">x = 0</text><text x="120" y="125" font-size="20" text-anchor="middle">even: 1</text><rect x="220" y="60" width="160" height="95" rx="6" fill="#fffdf8" stroke="#222"/><text x="300" y="90" font-size="20" text-anchor="middle">x = 1</text><text x="300" y="125" font-size="20" text-anchor="middle">even: 0</text><rect x="400" y="60" width="160" height="95" rx="6" fill="#fffdf8" stroke="#222"/><text x="480" y="90" font-size="20" text-anchor="middle">x = 2</text><text x="480" y="125" font-size="20" text-anchor="middle">even: 1</text><text x="300" y="195" font-size="25" text-anchor="middle">∀ : 0    /    ∃ : 1</text><text x="300" y="235" font-size="18" text-anchor="middle">1 refutes ∀; 0 or 2 witnesses ∃.</text></g></svg>
