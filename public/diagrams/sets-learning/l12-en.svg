<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title"><title id="title">Negate the whole statement</title><rect width="600" height="260" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#111"><text x="300" y="30" font-size="24" text-anchor="middle">Negate the whole statement</text><rect x="20" y="60" width="240" height="55" rx="6" fill="#fffdf8" stroke="#222"/><text x="140" y="95" font-size="24" text-anchor="middle">¬(∀x P(x))</text><text x="300" y="95" font-size="30" text-anchor="middle">≡</text><rect x="340" y="60" width="240" height="55" rx="6" fill="#fffdf8" stroke="#222"/><text x="460" y="95" font-size="24" text-anchor="middle">∃x ¬P(x)</text><rect x="20" y="135" width="240" height="55" rx="6" fill="#fffdf8" stroke="#222"/><text x="140" y="170" font-size="24" text-anchor="middle">¬(∃x P(x))</text><text x="300" y="170" font-size="30" text-anchor="middle">≡</text><rect x="340" y="135" width="240" height="55" rx="6" fill="#fffdf8" stroke="#222"/><text x="460" y="170" font-size="24" text-anchor="middle">∀x ¬P(x)</text><text x="300" y="235" font-size="20" text-anchor="middle">NOT(x &gt; 3) becomes x ≤ 3.</text></g></svg>
