<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260"><title>Appartenance et inclusion</title><g font-family="sans-serif" font-size="18" fill="#182d29"><rect x="10" y="12" width="260" height="178" rx="16" fill="#fff" stroke="#182d29" stroke-width="2"/><rect x="290" y="12" width="260" height="178" rx="16" fill="#fff" stroke="#182d29" stroke-width="2"/><text x="28" y="39">A = {1, 2}</text><text x="308" y="39">B = {0, {0}}</text><g fill="#e5f2ee" stroke="#176b5b"><rect x="45" y="69" width="70" height="52" rx="9"/><rect x="155" y="69" width="70" height="52" rx="9"/><rect x="325" y="69" width="70" height="52" rx="9"/><rect x="435" y="69" width="80" height="52" rx="9"/></g><g text-anchor="middle"><text x="80" y="102">1</text><text x="190" y="102">2</text><text x="360" y="102">0</text><text x="475" y="102">{0}</text><text x="140" y="151">{1} ∉ A</text><text x="140" y="174">{1} ⊆ A</text><text x="420" y="151">{0} ∈ B</text><text x="420" y="174">{0} ⊆ B</text></g><g fill="none" stroke="#176b5b" stroke-width="2" stroke-dasharray="5 4"><rect x="36" y="60" width="88" height="70" rx="12"/><rect x="316" y="60" width="88" height="70" rx="12"/></g><text x="280" y="222" text-anchor="middle" font-size="16">Tuile = élément direct</text><text x="280" y="244" text-anchor="middle" font-size="16">Contour pointillé = partie sélectionnée</text></g></svg>