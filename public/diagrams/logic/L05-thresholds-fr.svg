<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-labelledby="title"><title id="title">Conditions sur les réels</title><rect width="560" height="240" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#18221c"><text x="280" y="22" text-anchor="middle" font-weight="bold">Seuils inclusifs du professeur</text><path d="M50 60H530 M50 115H530 M50 170H530" stroke="#a1aaa4" fill="none" stroke-width="1"/><rect x="200" y="40" width="150" height="150" fill="#f4dfca" opacity=".5"/><path d="M200 60H520l-10 -6m10 6l-10 6 M350 115H520l-10 -6m10 6l-10 6" stroke="#235746" fill="none" stroke-width="4"/><circle cx="200" cy="60" r="6" fill="#235746"/><circle cx="350" cy="115" r="6" fill="#235746"/><text x="12" y="51" font-size="15">B : x ≥ 5</text><text x="12" y="106" font-size="15">A : x ≥ 10</text><path d="M50 164V176 M200 164V176 M350 164V176 M500 164V176" stroke="#18221c" stroke-width="2"/><text x="50" y="190" text-anchor="middle" font-size="15">0</text><text x="200" y="190" text-anchor="middle" font-size="15">5</text><text x="350" y="190" text-anchor="middle" font-size="15">10</text><text x="500" y="190" text-anchor="middle" font-size="15">15</text><text x="275" y="213" text-anchor="middle" font-size="14">5 ≤ x &lt; 10 : B vraie, A fausse</text><text x="280" y="234" text-anchor="middle" font-size="14">A suffit pour B ; B est nécessaire pour A.</text></g></svg>
