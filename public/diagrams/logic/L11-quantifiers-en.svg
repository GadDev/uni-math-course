<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260"><title>Witness and counterexample</title><g font-family="sans-serif" fill="#182d29"><rect x="12" y="12" width="536" height="236" rx="18" fill="#fff" stroke="#182d29" stroke-width="2"/><text x="28" y="40" font-size="20">X = {1, 2, 4}</text><text x="532" y="40" text-anchor="end" font-size="18">P(x): x is even</text><g stroke-width="2"><rect x="48" y="66" width="136" height="83" rx="12" fill="#fff3e9" stroke="#8d4321"/><rect x="212" y="66" width="136" height="83" rx="12" fill="#e6f3ed" stroke="#176b5b"/><rect x="376" y="66" width="136" height="83" rx="12" fill="#e6f3ed" stroke="#176b5b"/></g><g text-anchor="middle" font-size="22"><text x="116" y="98">1</text><text x="280" y="98">2</text><text x="444" y="98">4</text><text x="116" y="132">P(1) = 0</text><text x="280" y="132">P(2) = 1</text><text x="444" y="132">P(4) = 1</text></g><path d="M116 149V171H150M280 149V171H410V149M410 171H444" stroke="#182d29" stroke-width="1.5" fill="none"/><g text-anchor="middle"><text x="148" y="197" font-size="18">Counterexample</text><text x="414" y="197" font-size="18">Witnesses</text><text x="148" y="226" font-size="20">∀ : false</text><text x="414" y="226" font-size="20">∃ : true</text></g></g></svg>