<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-labelledby="title"><title id="title">Scope of NOT</title><rect width="560" height="240" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#18221c"><text x="280" y="24" text-anchor="middle" font-weight="bold">A = 1, B = 1</text><rect x="20" y="42" width="240" height="42" rx="5" fill="#e5ece8" stroke="#46534b"/><text x="140" y="69" text-anchor="middle" font-size="21">(¬A) ∨ B</text><path d="M140 84V109m-5 -6l5 6l5 -6 M140 153V178m-5 -6l5 6l5 -6" stroke="#46534b" fill="none" stroke-width="2"/><rect x="20" y="109" width="240" height="44" rx="5" fill="#f4f4f4" stroke="#46534b"/><text x="140" y="137" text-anchor="middle">NOT A: 0</text><rect x="20" y="178" width="240" height="44" rx="5" fill="#f4ece5" stroke="#75462d"/><text x="140" y="206" text-anchor="middle" font-size="21" font-weight="bold">0 ∨ 1 = 1</text><rect x="300" y="42" width="240" height="42" rx="5" fill="#e5ece8" stroke="#46534b"/><text x="420" y="69" text-anchor="middle" font-size="21">¬(A ∨ B)</text><path d="M420 84V109m-5 -6l5 6l5 -6 M420 153V178m-5 -6l5 6l5 -6" stroke="#46534b" fill="none" stroke-width="2"/><rect x="300" y="109" width="240" height="44" rx="5" fill="#f4f4f4" stroke="#46534b"/><text x="420" y="137" text-anchor="middle">A OR B: 1</text><rect x="300" y="178" width="240" height="44" rx="5" fill="#f4ece5" stroke="#75462d"/><text x="420" y="206" text-anchor="middle" font-size="21" font-weight="bold">¬1 = 0</text></g></svg>
