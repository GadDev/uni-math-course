<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 225" role="img" aria-labelledby="title"><title id="title">La phrase menteuse</title><rect width="560" height="225" fill="#fff"/><g font-family="Arial,sans-serif" font-size="16" fill="#18221c"><text x="280" y="27" font-size="17" font-weight="bold" text-anchor="middle">Cette phrase est fausse.</text><g stroke="#46534b" fill="none" stroke-width="2"><path d="M280 36V48H140V60 M280 48H420V60 M140 103V134 M420 103V134"/></g><rect x="20" y="60" width="240" height="43" rx="5" fill="#e5ece8" stroke="#46534b"/><text x="140" y="86" text-anchor="middle">Supposons : vraie</text><rect x="20" y="134" width="240" height="43" rx="5" fill="#f4ece5" stroke="#75462d"/><text x="140" y="160" text-anchor="middle">Alors : fausse</text><text x="140" y="202" text-anchor="middle" font-weight="bold">Contradiction</text><rect x="300" y="60" width="240" height="43" rx="5" fill="#e5ece8" stroke="#46534b"/><text x="420" y="86" text-anchor="middle">Supposons : fausse</text><rect x="300" y="134" width="240" height="43" rx="5" fill="#f4ece5" stroke="#75462d"/><text x="420" y="160" text-anchor="middle">Alors : vraie</text><text x="420" y="202" text-anchor="middle" font-weight="bold">Contradiction</text></g></svg>
