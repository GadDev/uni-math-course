<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="title"><title id="title">Décider si une phrase est une assertion</title><rect width="560" height="320" fill="#fff"/><g font-family="Arial,sans-serif" font-size="16" fill="#18221c"><g stroke="#46534b" fill="none" stroke-width="2"><path d="M280 68V91H130V115 M280 91H410V115 M410 167V190H280V213 M410 190H475V213"/></g><rect x="65" y="12" width="430" height="56" rx="6" fill="#e5ece8" stroke="#46534b"/><text x="280" y="35" text-anchor="middle" font-weight="bold">Une valeur cohérente unique ?</text><text x="280" y="54" text-anchor="middle" font-size="13">Sens et contexte fixés</text><text x="130" y="105" text-anchor="middle" font-size="13">Non</text><text x="410" y="105" text-anchor="middle" font-size="13">Oui</text><rect x="12" y="115" width="236" height="52" rx="5" fill="#f4ece5" stroke="#75462d"/><text x="130" y="146" text-anchor="middle">Pas une assertion</text><rect x="310" y="115" width="200" height="52" rx="5" fill="#e5ece8" stroke="#46534b"/><text x="410" y="137" text-anchor="middle" font-weight="bold">Assertion</text><text x="410" y="155" text-anchor="middle" font-size="13">Valeur connue ?</text><text x="280" y="204" text-anchor="middle" font-size="13">Oui</text><text x="475" y="204" text-anchor="middle" font-size="13">Non</text><rect x="192" y="213" width="176" height="65" rx="5" fill="#e5ece8" stroke="#46534b"/><text x="280" y="238" text-anchor="middle">Vrai : 1</text><text x="280" y="260" text-anchor="middle">Faux : 0</text><rect x="394" y="213" width="162" height="65" rx="5" fill="#f4f4f4" stroke="#46534b" stroke-dasharray="5 3"/><text x="475" y="238" text-anchor="middle" font-size="14">0 ou 1</text><text x="475" y="260" text-anchor="middle" font-size="13">Non établie</text><text x="280" y="305" font-weight="bold" font-size="15" text-anchor="middle">Inconnu ≠ troisième valeur</text></g></svg>
