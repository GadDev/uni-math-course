<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" aria-labelledby="title"><title id="title">Une ligne, une loi</title><rect width="560" height="290" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#18221c"><rect x="10" y="10" width="330" height="45" rx="5" fill="#e5ece8" stroke="#53665b"/><text x="175" y="39" text-anchor="middle" font-size="20">B ∨ (A ∧ ¬B)</text><rect x="10" y="82" width="330" height="45" rx="5" fill="#e5ece8" stroke="#53665b"/><text x="175" y="111" text-anchor="middle" font-size="20">(B ∨ A) ∧ (B ∨ ¬B)</text><path d="M175 55V82" stroke="#53665b" stroke-width="2"/><text x="195" y="74" font-size="15">≡</text><text x="355" y="111" font-size="14">Distributivité</text><rect x="10" y="154" width="330" height="45" rx="5" fill="#e5ece8" stroke="#53665b"/><text x="175" y="183" text-anchor="middle" font-size="20">(B ∨ A) ∧ ⊤</text><path d="M175 127V154" stroke="#53665b" stroke-width="2"/><text x="195" y="146" font-size="15">≡</text><text x="355" y="183" font-size="14">Tiers exclu</text><rect x="10" y="226" width="330" height="45" rx="5" fill="#e5ece8" stroke="#53665b"/><text x="175" y="255" text-anchor="middle" font-size="20">B ∨ A</text><path d="M175 199V226" stroke="#53665b" stroke-width="2"/><text x="195" y="218" font-size="15">≡</text><text x="355" y="255" font-size="14">Élément neutre</text></g></svg>
