<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title"><title id="title">Implication transformations</title><rect width="560" height="300" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#18221c"><rect x="20" y="10" width="240" height="70" rx="5" fill="#dce9e0" stroke="#235746" stroke-width="2"/><text x="140" y="29" text-anchor="middle" font-size="14">Original</text><text x="140" y="52" text-anchor="middle" font-size="22" font-weight="bold">A ⇒ B</text><text x="140" y="69" text-anchor="middle" font-size="12"></text><rect x="300" y="10" width="240" height="70" rx="5" fill="#f4f4f4" stroke="#53665b" stroke-width="1"/><text x="420" y="29" text-anchor="middle" font-size="14">Converse</text><text x="420" y="52" text-anchor="middle" font-size="22" font-weight="bold">B ⇒ A</text><text x="420" y="69" text-anchor="middle" font-size="12">Swap</text><rect x="20" y="115" width="240" height="70" rx="5" fill="#f4f4f4" stroke="#53665b" stroke-width="1"/><text x="140" y="134" text-anchor="middle" font-size="14">Inverse</text><text x="140" y="157" text-anchor="middle" font-size="22" font-weight="bold">¬A ⇒ ¬B</text><text x="140" y="174" text-anchor="middle" font-size="12">Negate operands</text><rect x="300" y="115" width="240" height="70" rx="5" fill="#dce9e0" stroke="#235746" stroke-width="2"/><text x="420" y="134" text-anchor="middle" font-size="14">Contrapositive</text><text x="420" y="157" text-anchor="middle" font-size="22" font-weight="bold">¬B ⇒ ¬A</text><text x="420" y="174" text-anchor="middle" font-size="12">Swap and negate</text><rect x="160" y="220" width="240" height="70" rx="5" fill="#f4f4f4" stroke="#53665b" stroke-width="1"/><text x="280" y="239" text-anchor="middle" font-size="14">Negation</text><text x="280" y="262" text-anchor="middle" font-size="22" font-weight="bold">A ∧ ¬B</text><text x="280" y="279" text-anchor="middle" font-size="12">Describe failure</text><text x="280" y="102" text-anchor="middle" font-size="13">Original and contrapositive: equivalent</text><text x="280" y="207" text-anchor="middle" font-size="13">Negation does not preserve meaning</text></g></svg>
