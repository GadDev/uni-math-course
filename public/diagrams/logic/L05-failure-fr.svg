<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-labelledby="title"><title id="title">Le seul échec</title><rect width="560" height="220" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#18221c"><text x="280" y="25" text-anchor="middle" font-weight="bold">Une seule affectation interdite</text><text x="90" y="52" text-anchor="middle">A, B</text><text x="280" y="52" text-anchor="middle">A ⇒ B</text><text x="470" y="52" text-anchor="middle">¬(A ⇒ B)</text><rect x="12" y="64" width="536" height="28" rx="4" fill="#f2f5f3" stroke="#87958c"/><text x="90" y="84" text-anchor="middle">0, 0</text><text x="280" y="84" text-anchor="middle">1</text><text x="470" y="84" text-anchor="middle">0</text><rect x="12" y="98" width="536" height="28" rx="4" fill="#f2f5f3" stroke="#87958c"/><text x="90" y="118" text-anchor="middle">0, 1</text><text x="280" y="118" text-anchor="middle">1</text><text x="470" y="118" text-anchor="middle">0</text><rect x="12" y="132" width="536" height="28" rx="4" fill="#f4dfca" stroke="#8b3a2c"/><text x="90" y="152" text-anchor="middle">1, 0</text><text x="280" y="152" text-anchor="middle">0</text><text x="470" y="152" text-anchor="middle">1</text><rect x="12" y="166" width="536" height="28" rx="4" fill="#f2f5f3" stroke="#87958c"/><text x="90" y="186" text-anchor="middle">1, 1</text><text x="280" y="186" text-anchor="middle">1</text><text x="470" y="186" text-anchor="middle">0</text><text x="280" y="214" text-anchor="middle" font-size="14">Contre-exemple : A = 1 et B = 0.</text></g></svg>
