<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="title"><title id="title">Comparer toutes les lignes</title><rect width="560" height="260" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#18221c"><text x="280" y="24" text-anchor="middle" font-weight="bold">Toutes les lignes, pas seulement une</text><text x="80" y="60" text-anchor="middle">A, B</text><text x="210" y="60" text-anchor="middle">A ∧ B</text><text x="340" y="60" text-anchor="middle">B ∧ A</text><text x="470" y="60" text-anchor="middle">A ∨ B</text><text x="80" y="95" text-anchor="middle">0, 0</text><rect x="184" y="74" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="210" y="95" text-anchor="middle">0</text><rect x="314" y="74" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="340" y="95" text-anchor="middle">0</text><rect x="444" y="74" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="470" y="95" text-anchor="middle">0</text><text x="80" y="130" text-anchor="middle">0, 1</text><rect x="184" y="109" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="210" y="130" text-anchor="middle">0</text><rect x="314" y="109" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="340" y="130" text-anchor="middle">0</text><rect x="444" y="109" width="52" height="28" rx="3" fill="#f4dfca" stroke="#8b3a2c"/><text x="470" y="130" text-anchor="middle">1</text><text x="80" y="165" text-anchor="middle">1, 0</text><rect x="184" y="144" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="210" y="165" text-anchor="middle">0</text><rect x="314" y="144" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="340" y="165" text-anchor="middle">0</text><rect x="444" y="144" width="52" height="28" rx="3" fill="#f4dfca" stroke="#8b3a2c"/><text x="470" y="165" text-anchor="middle">1</text><text x="80" y="200" text-anchor="middle">1, 1</text><rect x="184" y="179" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="210" y="200" text-anchor="middle">1</text><rect x="314" y="179" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="340" y="200" text-anchor="middle">1</text><rect x="444" y="179" width="52" height="28" rx="3" fill="#e5ece8" stroke="#53665b"/><text x="470" y="200" text-anchor="middle">1</text><text x="275" y="231" text-anchor="middle" font-size="14">Colonnes identiques : équivalence</text><text x="470" y="231" text-anchor="middle" font-size="13">Différence : réfutation</text></g></svg>
