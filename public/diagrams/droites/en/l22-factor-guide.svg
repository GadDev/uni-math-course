<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" role="img" aria-labelledby="title"><title id="title">Choose a method</title><rect width="600" height="345" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="15" fill="#202520"><path d="M300 55V70H145V92 M300 70H455V92 M145 137V151H455V137 M455 137V161H145V180 M455 161V180 M145 225V248H300V270 M455 225V248H300" fill="none" stroke="#235746" stroke-width="1.6"/><text x="130" y="83" text-anchor="end">Yes</text><text x="470" y="83">No</text><rect x="150" y="10" width="300" height="45" rx="5" fill="#edf2ec" stroke="#235746"/><text x="300" y="38" text-anchor="middle">Common factor?</text><rect x="15" y="92" width="260" height="45" rx="5" fill="#edf2ec" stroke="#235746"/><text x="145" y="120" text-anchor="middle">Extract the factor</text><rect x="325" y="92" width="260" height="45" rx="5" fill="#edf2ec" stroke="#235746"/><text x="455" y="120" text-anchor="middle">Look for an identity</text><rect x="15" y="180" width="260" height="45" rx="5" fill="#edf2ec" stroke="#235746"/><text x="145" y="208" text-anchor="middle">Difference of squares?</text><rect x="325" y="180" width="260" height="45" rx="5" fill="#edf2ec" stroke="#235746"/><text x="455" y="208" text-anchor="middle">Perfect square?</text><rect x="95" y="270" width="410" height="45" rx="5" fill="#edf2ec" stroke="#235746"/><text x="300" y="298" text-anchor="middle">Expand back to check</text><text x="300" y="338" text-anchor="middle" font-size="12">If no pattern fits: do not force it.</text></g></svg>
