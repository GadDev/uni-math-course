<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="title"><title id="title">Double distributivity</title><rect width="480" height="250" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="15" fill="#202520"><text x="240" y="25" text-anchor="middle" font-weight="bold">(x + 2)(x + 3)</text><text x="165" y="58" text-anchor="middle">x</text><text x="305" y="58" text-anchor="middle">3</text><text x="72" y="96" text-anchor="middle">x</text><text x="72" y="150" text-anchor="middle">2</text><rect x="95" y="67" width="140" height="54" fill="#e0eee6" stroke="#235746"/><text x="165" y="100" text-anchor="middle" font-size="20">x²</text><rect x="235" y="67" width="140" height="54" fill="#f7e5d7" stroke="#235746"/><text x="305" y="100" text-anchor="middle" font-size="20">3x</text><rect x="95" y="121" width="140" height="54" fill="#f7e5d7" stroke="#235746"/><text x="165" y="154" text-anchor="middle" font-size="20">2x</text><rect x="235" y="121" width="140" height="54" fill="#e0eee6" stroke="#235746"/><text x="305" y="154" text-anchor="middle" font-size="20">6</text><text x="240" y="207" text-anchor="middle">x² + 3x + 2x + 6</text><text x="240" y="234" text-anchor="middle" font-weight="bold">= x² + 5x + 6</text></g></svg>
