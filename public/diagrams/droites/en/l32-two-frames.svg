<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">Two coordinate frames for one point</title>
<desc id="desc">P(2,1) becomes P(500,250), right and above the centre.</desc>
<rect width="640" height="350" fill="#fffdf8"/>
<g font-family="Arial,sans-serif" font-size="15" fill="#202520">
<text x="126" y="24" text-anchor="middle" font-weight="bold">Mathematical frame</text>
<text x="446" y="24" text-anchor="middle" font-weight="bold">800 × 600 screen</text>
<g stroke="#d5dad5" fill="none">
<path d="M30 46V270 M30 62H222"/>
<path d="M62 46V270 M30 94H222"/>
<path d="M94 46V270 M30 126H222"/>
<path d="M126 46V270 M30 158H222"/>
<path d="M158 46V270 M30 190H222"/>
<path d="M190 46V270 M30 222H222"/>
<path d="M222 46V270 M30 254H222"/>
</g>
<path d="M20 158H238 M126 280V38 M232 154L238 158 232 162 M122 44L126 38 130 44" stroke="#202520" stroke-width="1.5" fill="none"/>
<text x="241" y="153">x</text><text x="134" y="42">y</text><text x="114" y="176">O</text>
<path d="M126 158H190V126" fill="none" stroke="#8b3a2c" stroke-width="2" stroke-dasharray="5 3"/>
<circle cx="190" cy="126" r="5" fill="#235746"/><text x="195" y="117" font-weight="bold">P(2,1)</text>
<text x="158" y="180" text-anchor="middle">+2</text><text x="196" y="148">+1</text>
<rect x="286" y="38" width="320" height="240" fill="#edf2ec" stroke="#202520" stroke-width="1.5"/>
<path d="M286 38H618 M286 38V290 M612 34L618 38 612 42 M282 284L286 290 290 284" stroke="#202520" stroke-width="1.6" fill="none"/>
<path d="M446 38V278 M286 158H606" stroke="#6e776f" stroke-dasharray="4 4" fill="none"/>
<path d="M446 158H486V138" stroke="#8b3a2c" stroke-width="2.5" stroke-dasharray="5 3" fill="none"/>
<circle cx="446" cy="158" r="4" fill="#202520"/><circle cx="486" cy="138" r="5" fill="#235746"/>
<text x="292" y="56">(0,0)</text><text x="610" y="29">u</text><text x="274" y="306">v</text>
<text x="439" y="181" text-anchor="end">O(400,300)</text><text x="493" y="126" font-weight="bold">P(500,250)</text>
<text x="470" y="196" text-anchor="middle">+100 px</text><text x="492" y="156">−50 px</text>
<path d="M243 212H274 M267 206L274 212 267 218" stroke="#235746" stroke-width="2" fill="none"/>
<text x="320" y="320" text-anchor="middle" font-weight="bold">1 unit = 50 px · u = 400 + 50x · v = 300 − 50y</text>
<text x="320" y="341" text-anchor="middle">Same visual displacement, reversed numerical vertical direction.</text>
</g></svg>
