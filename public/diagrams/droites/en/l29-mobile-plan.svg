<text x="76" y="158">p = 10 €</text><text x="142" y="136">(1,12)</text><text x="252" y="87">(3,16)</text><text x="355" y="39" text-anchor="end">(5,20)</text>
<text x="98" y="190" text-anchor="middle">+1 GB</text><text x="137" y="163" fill="#8b3a2c">+2 €</text>
<text x="79" y="226" fill="#235746">Fixed cost</text><text x="210" y="345" text-anchor="middle" font-size="15" font-weight="bold">y = 2x + 10</text>
