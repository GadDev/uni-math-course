<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-labelledby="title desc">
<title id="title">Mobile plan: fixed price and cost per GB</title><desc id="desc">Price starts at 10 euros and increases by 2 euros per GB.</desc>
