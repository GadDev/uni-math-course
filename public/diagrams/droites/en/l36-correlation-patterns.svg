<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title"><title id="title">Three patterns, three coefficients</title><rect width="640" height="260" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="14" fill="#202520"><g><text x="105" y="25" font-weight="bold" text-anchor="middle">Increasing</text><path d="M40 180H197.5 M85 198V45" stroke="#202520" fill="none"/><path d="M40 180H197.5" stroke="#d5dad5"/><path d="M40 135H197.5" stroke="#d5dad5"/><path d="M40 90H197.5" stroke="#d5dad5"/><path d="M85 180L175 90" stroke="#235746" stroke-width="2.5"/><circle cx="85" cy="180" r="5" fill="#202520"/><circle cx="130" cy="135" r="5" fill="#202520"/><circle cx="175" cy="90" r="5" fill="#202520"/><text x="105" y="223" text-anchor="middle" font-size="18" font-weight="bold">r = 1</text></g><g><text x="315" y="25" font-weight="bold" text-anchor="middle">Decreasing</text><path d="M250 180H407.5 M295 198V45" stroke="#202520" fill="none"/><path d="M250 180H407.5" stroke="#d5dad5"/><path d="M250 135H407.5" stroke="#d5dad5"/><path d="M250 90H407.5" stroke="#d5dad5"/><path d="M295 90L385 180" stroke="#235746" stroke-width="2.5"/><circle cx="295" cy="90" r="5" fill="#202520"/><circle cx="340" cy="135" r="5" fill="#202520"/><circle cx="385" cy="180" r="5" fill="#202520"/><text x="315" y="223" text-anchor="middle" font-size="18" font-weight="bold">r = −1</text></g><g><text x="525" y="25" font-weight="bold" text-anchor="middle">Curved</text><path d="M460 180H617.5 M505 198V45" stroke="#202520" fill="none"/><path d="M460 180H617.5" stroke="#d5dad5"/><path d="M460 135H617.5" stroke="#d5dad5"/><path d="M460 90H617.5" stroke="#d5dad5"/><path d="M460 135Q505 225 550 135" stroke="#235746" stroke-width="2.5" fill="none"/><circle cx="460" cy="135" r="5" fill="#202520"/><circle cx="505" cy="180" r="5" fill="#202520"/><circle cx="550" cy="135" r="5" fill="#202520"/><text x="525" y="223" text-anchor="middle" font-size="18" font-weight="bold">r = 0</text></g></g></svg>
