<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title"><title id="title">Équilibre conservé</title><rect width="640" height="220" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="15" fill="#202520"><g transform="translate(0 0)"><text x="105" y="24" text-anchor="middle" font-weight="bold">1. Départ</text><path d="M28 65H182 M105 65V150 M90 150H120 M45 65L12 115H78Z M165 65L132 115H198Z" stroke="#53665b" fill="none" stroke-width="2"/><rect x="8" y="115" width="74" height="6" fill="#53665b"/><rect x="128" y="115" width="74" height="6" fill="#53665b"/><text x="45" y="106" text-anchor="middle" font-size="15">3x + 5</text><text x="165" y="106" text-anchor="middle" font-size="15">11</text><text x="105" y="185" text-anchor="middle" font-weight="bold">3x + 5 = 11</text></g><g transform="translate(210 0)"><text x="105" y="24" text-anchor="middle" font-weight="bold">2. Retirer 5</text><path d="M28 65H182 M105 65V150 M90 150H120 M45 65L12 115H78Z M165 65L132 115H198Z" stroke="#53665b" fill="none" stroke-width="2"/><rect x="8" y="115" width="74" height="6" fill="#53665b"/><rect x="128" y="115" width="74" height="6" fill="#53665b"/><text x="45" y="106" text-anchor="middle" font-size="15">3x</text><text x="165" y="106" text-anchor="middle" font-size="15">6</text><text x="105" y="185" text-anchor="middle" font-weight="bold">3x = 6</text></g><g transform="translate(420 0)"><text x="105" y="24" text-anchor="middle" font-weight="bold">3. Diviser par 3</text><path d="M28 65H182 M105 65V150 M90 150H120 M45 65L12 115H78Z M165 65L132 115H198Z" stroke="#53665b" fill="none" stroke-width="2"/><rect x="8" y="115" width="74" height="6" fill="#53665b"/><rect x="128" y="115" width="74" height="6" fill="#53665b"/><text x="45" y="106" text-anchor="middle" font-size="15">x</text><text x="165" y="106" text-anchor="middle" font-size="15">2</text><text x="105" y="185" text-anchor="middle" font-weight="bold">x = 2</text></g><text x="320" y="210" text-anchor="middle" font-size="13">Même opération sur les deux membres</text></g></svg>
