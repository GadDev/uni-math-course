<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-labelledby="title desc">
<title id="title">Tester l’appartenance à une droite</title><desc id="desc">A et D sont sur la droite. B est une unité en dessous de D.</desc>
<rect width="440" height="360" fill="#fffdf8"/>
<g font-family="Arial,sans-serif" font-size="14" fill="#202520"><path d="M88 28V292" stroke="#d8ddd7"/><text x="88" y="310" text-anchor="middle">-1</text>
<path d="M132 28V292" stroke="#d8ddd7"/><text x="132" y="310" text-anchor="middle">0</text>
<path d="M176 28V292" stroke="#d8ddd7"/><text x="176" y="310" text-anchor="middle">1</text>
<path d="M220 28V292" stroke="#d8ddd7"/><text x="220" y="310" text-anchor="middle">2</text>
<path d="M264 28V292" stroke="#d8ddd7"/><text x="264" y="310" text-anchor="middle">3</text>
<path d="M88 292H264" stroke="#d8ddd7"/><text x="79" y="296" text-anchor="end">-1</text>
<path d="M88 248H264" stroke="#d8ddd7"/><text x="79" y="252" text-anchor="end">0</text>
<path d="M88 204H264" stroke="#d8ddd7"/><text x="79" y="208" text-anchor="end">1</text>
<path d="M88 160H264" stroke="#d8ddd7"/><text x="79" y="164" text-anchor="end">2</text>
<path d="M88 116H264" stroke="#d8ddd7"/><text x="79" y="120" text-anchor="end">3</text>
<path d="M88 72H264" stroke="#d8ddd7"/><text x="79" y="76" text-anchor="end">4</text>
<path d="M88 28H264" stroke="#d8ddd7"/><text x="79" y="32" text-anchor="end">5</text>
<path d="M80 248H282 M132 300V20" stroke="#202520" stroke-width="1.5" fill="none"/>
<text x="286" y="250">x</text><text x="141" y="22">y</text>
<path d="M88 292L220 28" stroke="#235746" stroke-width="3" fill="none"/>
<circle cx="88" cy="292" r="3" fill="#235746"/><circle cx="132" cy="204" r="3" fill="#235746"/>
<path d="M220 72V28" stroke="#8b3a2c" stroke-dasharray="5 4" stroke-width="2"/>
<circle cx="176" cy="116" r="5" fill="#235746"/><circle cx="220" cy="28" r="5" fill="#235746"/>
<path d="M214 66L226 78 M214 78L226 66" stroke="#8b3a2c" stroke-width="3"/>
<text x="164" y="105" text-anchor="end">A (1,3)</text>
<text x="232" y="31">D (2,5)</text><text x="232" y="75">B (2,4)</text>
<text x="236" y="53" font-size="12">écart = 1</text>
<text x="22" y="337" font-size="13">● Sur la droite ; × Hors de la droite</text>
<text x="288" y="337" font-size="14">y = 2x + 1</text>
</g></svg>
