<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="title"><title id="title">Total cumulé</title><rect width="600" height="240" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="16" fill="#202520"><text x="300" y="24" text-anchor="middle" font-weight="bold">Σ (2i − 1), i = 2, 3, 4</text><rect x="24" y="42" width="160" height="65" rx="6" fill="#e0eee6" stroke="#235746"/><text x="104" y="68" text-anchor="middle">i = 2</text><text x="104" y="91" text-anchor="middle">2 × 2 − 1 = 3</text><path d="M104 107v24l-5 -5m5 5l5 -5" stroke="#235746" fill="none"/><rect x="24" y="137" width="160" height="55" rx="6" fill="#f4dfca" stroke="#8b3a2c"/><text x="104" y="171" text-anchor="middle" font-weight="bold">0 + 3 = 3</text><rect x="220" y="42" width="160" height="65" rx="6" fill="#e0eee6" stroke="#235746"/><text x="300" y="68" text-anchor="middle">i = 3</text><text x="300" y="91" text-anchor="middle">2 × 3 − 1 = 5</text><path d="M300 107v24l-5 -5m5 5l5 -5" stroke="#235746" fill="none"/><rect x="220" y="137" width="160" height="55" rx="6" fill="#f4dfca" stroke="#8b3a2c"/><text x="300" y="171" text-anchor="middle" font-weight="bold">3 + 5 = 8</text><rect x="416" y="42" width="160" height="65" rx="6" fill="#e0eee6" stroke="#235746"/><text x="496" y="68" text-anchor="middle">i = 4</text><text x="496" y="91" text-anchor="middle">2 × 4 − 1 = 7</text><path d="M496 107v24l-5 -5m5 5l5 -5" stroke="#235746" fill="none"/><rect x="416" y="137" width="160" height="55" rx="6" fill="#f4dfca" stroke="#8b3a2c"/><text x="496" y="171" text-anchor="middle" font-weight="bold">8 + 7 = 15</text><text x="300" y="222" text-anchor="middle">Total final : 15</text></g></svg>
