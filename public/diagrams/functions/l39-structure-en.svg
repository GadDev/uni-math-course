<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 255" role="img" aria-labelledby="title"><title id="title">Read the structure</title><rect width="600" height="255" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="16" fill="#202520"><g transform="translate(0 0)"><text x="100" y="25" text-anchor="middle" font-weight="bold">Product</text><rect x="65" y="40" width="70" height="50" rx="6" fill="#dce9e0" stroke="#235746"/><text x="100" y="73" text-anchor="middle" font-size="26">×</text><path d="M100 90V115H48V140 M100 115H152V140" stroke="#53665b" fill="none"/><rect x="6" y="140" width="84" height="45" rx="4" fill="#e1e9f1" stroke="#53665b"/><rect x="110" y="140" width="84" height="45" rx="4" fill="#f4dfca" stroke="#8b3a2c"/><text x="48" y="168" text-anchor="middle">x²</text><text x="152" y="168" text-anchor="middle">x + 1</text><text x="48" y="207" font-size="13" text-anchor="middle">Factor 1</text><text x="152" y="207" font-size="13" text-anchor="middle">Factor 2</text></g><g transform="translate(200 0)"><text x="100" y="25" text-anchor="middle" font-weight="bold">Quotient</text><rect x="65" y="40" width="70" height="50" rx="6" fill="#dce9e0" stroke="#235746"/><text x="100" y="73" text-anchor="middle" font-size="26">÷</text><path d="M100 90V115H48V140 M100 115H152V140" stroke="#53665b" fill="none"/><rect x="6" y="140" width="84" height="45" rx="4" fill="#e1e9f1" stroke="#53665b"/><rect x="110" y="140" width="84" height="45" rx="4" fill="#f4dfca" stroke="#8b3a2c"/><text x="48" y="168" text-anchor="middle">x</text><text x="152" y="168" text-anchor="middle">x + 1</text><text x="48" y="207" font-size="13" text-anchor="middle">Top</text><text x="152" y="207" font-size="13" text-anchor="middle">Bottom</text></g><g transform="translate(400 0)"><text x="100" y="25" text-anchor="middle" font-weight="bold">Composition</text><rect x="65" y="40" width="70" height="50" rx="6" fill="#dce9e0" stroke="#235746"/><text x="100" y="73" text-anchor="middle" font-size="26