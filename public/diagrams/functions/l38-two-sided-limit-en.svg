<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title"><title id="title">Limit of slopes</title><rect width="560" height="300" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="15" fill="#202520"><text x="280" y="22" text-anchor="middle" font-weight="bold">Secant slope: 1 + h/2</text><path d="M65 225H510 M280 235V40" stroke="#53665b" stroke-width="1.6" fill="none"/><text x="518" y="230">h</text><path d="M80 220v10" stroke="#53665b"/><text x="80" y="251" text-anchor="middle">-2</text><path d="M180 220v10" stroke="#53665b"/><text x="180" y="251" text-anchor="middle">-1</text><path d="M280 220v10" stroke="#53665b"/><text x="280" y="251" text-anchor="middle">0</text><path d="M380 220v10" stroke="#53665b"/><text x="380" y="251" text-anchor="middle">1</text><path d="M480 220v10" stroke="#53665b"/><text x="480" y="251" text-anchor="middle">2</text><path d="M275 225h10" stroke="#53665b"/><text x="269" y="230" text-anchor="end"></text><path d="M275 145h10" stroke="#53665b"/><text x="269" y="150" text-anchor="end">1</text><path d="M275 65h10" stroke="#53665b"/><text x="269" y="70" text-anchor="end">2</text><path d="M65 145H510" stroke="#8b3a2c" stroke-dasharray="5 4" fill="none"/><path d="M80 225L273 147.8 M287 142.2L480 65" stroke="#235746" stroke-width="3" fill="none"/><circle cx="280" cy="145" r="7" stroke="#8b3a2c" stroke-width="2.5" fill="#fffdf8"/><path d="M193 197L247 175 M240 174L247 175L242 181 M367 93L313 115 M320 114L313 115L318 108" stroke="#53665b" stroke-width="2" fill="none"/><text x="133" y="170" font-size="13" text-anchor="middle">h → 0⁻</text><text x="430" y="116" font-size="13" text-anchor="middle">h → 0⁺</text><text x="295" y="166" font-size="13">Undefined quotient</text><text x="280" y="282" text-anchor="middle" font-weight="bold">Same limit: 1</text></g></svg>
