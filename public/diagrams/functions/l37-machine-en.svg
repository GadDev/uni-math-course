<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" role="img" aria-labelledby="title"><title id="title">From input to point</title><rect width="560" height="180" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="16" fill="#202520"><rect x="15" y="45" width="86" height="62" rx="6" fill="#e0eee6" stroke="#1455C0"/><rect x="147" y="45" width="158" height="62" rx="6" fill="#d7e4ef" stroke="#1455C0"/><rect x="351" y="45" width="70" height="62" rx="6" fill="#f4dfca" stroke="#8b3a2c"/><rect x="465" y="45" width="80" height="62" rx="6" fill="#fffdf8" stroke="#53665b"/><path d="M101 76H147l-7 -5m7 5l-7 5 M305 76H351l-7 -5m7 5l-7 5 M421 76H465l-7 -5m7 5l-7 5" stroke="#53665b" fill="none" stroke-width="2"/><text x="58" y="29" text-anchor="middle">Input</text><text x="226" y="29" text-anchor="middle">Rule</text><text x="386" y="29" text-anchor="middle">Output</text><text x="505" y="29" text-anchor="middle">Point</text><text x="58" y="82" text-anchor="middle" font-size="21">2</text><text x="226" y="82" text-anchor="middle" font-size="20">x³ + 2x + 3</text><text x="386" y="82" text-anchor="middle" font-size="21">15</text><text x="505" y="82" text-anchor="middle" font-size="17">(2; 15)</text><text x="280" y="151" text-anchor="middle" font-size="17">2³ + 2 × 2 + 3 = 15</text></g></svg>
