<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="title"><title id="title">Two points at x = 0: not a function of x</title><rect width="360" height="260" fill="#fffdf8"/><g font-family="Arial, sans-serif" font-size="20" fill="#111111"><line x1="30" y1="130" x2="330" y2="130" stroke="#111111" stroke-width="2" /><line x1="150" y1="240" x2="150" y2="20" stroke="#b92819" stroke-width="2" stroke-dasharray="6 4"/><circle cx="150" cy="130" r="85" fill="none" stroke="#1455c0" stroke-width="3"/><circle cx="150" cy="45" r="6" fill="#b92819" stroke="#b92819" stroke-width="2"/><circle cx="150" cy="215" r="6" fill="#b92819" stroke="#b92819" stroke-width="2"/><text x="168" y="40" text-anchor="start" >(0 ; 1)</text><text x="168" y="235" text-anchor="start" >(0 ; −1)</text><text x="300" y="118" text-anchor="middle" >x</text><text x="60" y="25" text-anchor="middle" >x = 0</text></g></svg>
