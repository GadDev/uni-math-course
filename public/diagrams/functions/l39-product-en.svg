<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" role="img" aria-labelledby="title"><title id="title">Product rule</title><rect width="560" height="210" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="16" fill="#202520"><text x="280" y="26" text-anchor="middle" font-weight="bold">D(x²(x + 1))</text><g transform="translate(0 42)"><rect x="18" y="0" width="80" height="44" rx="4" fill="#dce9e0" stroke="#235746"/><rect x="126" y="0" width="96" height="44" rx="4" fill="#fffdf8" stroke="#235746"/><text x="58" y="28" text-anchor="middle">2x</text><text x="112" y="28" text-anchor="middle">×</text><text x="174" y="28" text-anchor="middle">x + 1</text><text x="240" y="28" font-size="14">Differentiate x²; keep x + 1</text></g><g transform="translate(0 114)"><rect x="18" y="0" width="80" height="44" rx="4" fill="#fffdf8" stroke="#235746"/><rect x="126" y="0" width="96" height="44" rx="4" fill="#dce9e0" stroke="#235746"/><text x="58" y="28" text-anchor="middle">x²</text><text x="112" y="28" text-anchor="middle">×</text><text x="174" y="28" text-anchor="middle">1</text><text x="240" y="28" font-size="14">Keep x²; differentiate x + 1</text></g><text x="10" y="106" font-size="20">+</text><text x="280" y="197" text-anchor="middle" font-weight="bold">2x(x + 1) + x² = 3x² + 2x</text></g></svg>
