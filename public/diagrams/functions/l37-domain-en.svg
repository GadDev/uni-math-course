<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130" role="img" aria-labelledby="title"><title id="title">Domain: all real numbers except 0 and 2</title><rect width="480" height="130" fill="#fffdf8"/><g font-family="Arial, sans-serif" font-size="20" fill="#111111"><line x1="20" y1="85" x2="460" y2="85" stroke="#111111" stroke-width="2" /><line x1="20" y1="85" x2="30" y2="80" stroke="#111111" stroke-width="2" /><line x1="20" y1="85" x2="30" y2="90" stroke="#111111" stroke-width="2" /><line x1="460" y1="85" x2="450" y2="80" stroke="#111111" stroke-width="2" /><line x1="460" y1="85" x2="450" y2="90" stroke="#111111" stroke-width="2" /><line x1="50" y1="80" x2="50" y2="90" stroke="#111111" stroke-width="2" /><text x="50" y="117" text-anchor="middle" >−1</text><line x1="145" y1="80" x2="145" y2="90" stroke="#111111" stroke-width="2" /><text x="145" y="117" text-anchor="middle" >0</text><line x1="240" y1="80" x2="240" y2="90" stroke="#111111" stroke-width="2" /><text x="240" y="117" text-anchor="middle" >1</text><line x1="335" y1="80" x2="335" y2="90" stroke="#111111" stroke-width="2" /><text x="335" y="117" text-anchor="middle" >2</text><line x1="430" y1="80" x2="430" y2="90" stroke="#111111" stroke-width="2" /><text x="430" y="117" text-anchor="middle" >3</text><circle cx="145" cy="85" r="7" fill="#fffdf8" stroke="#b92819" stroke-width="2"/><text x="145" y="32" text-anchor="middle" >excluded</text><circle cx="335" cy="85" r="7" fill="#fffdf8" stroke="#b92819" stroke-width="2"/><text x="335" y="32" text-anchor="middle" >excluded</text></g></svg>
