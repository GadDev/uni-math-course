<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-labelledby="title"><title id="title">Chain rule</title><rect width="560" height="220" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="16" fill="#202520"><text x="280" y="24" text-anchor="middle" font-weight="bold">(2x + 1)³</text><rect x="70" y="55" width="160" height="60" rx="6" fill="#f4dfca" stroke="#8b3a2c"/><rect x="310" y="55" width="180" height="60" rx="6" fill="#dce9e0" stroke="#235746"/><path d="M20 85H70 M230 85H310 M490 85H540" stroke="#53665b" stroke-width="2"/><text x="28" y="77">x</text><text x="150" y="75" text-anchor="middle" font-size="13">Inner</text><text x="150" y="100" text-anchor="middle">u = 2x + 1</text><text x="270" y="76" text-anchor="middle">u</text><text x="400" y="75" text-anchor="middle" font-size="13">Outer</text><text x="400" y="100" text-anchor="middle">u³</text><text x="150" y="146" text-anchor="middle">Du = 2</text><text x="400" y="146" text-anchor="middle">D(u³) = 3u²</text><path d="M150 153V168H280 M400 153V168H280V179" stroke="#53665b" fill="none"/><text x="280" y="205" text-anchor="middle" font-weight="bold">3(2x + 1)² × 2 = 6(2x + 1)²</text></g></svg>
