<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Former les blocs et conserver les unités</title><desc id="desc">Grille de probabilités indépendantes : aa 4/9, ab et ba 2/9, bb 1/9. La moyenne 17/9 bits par paire se divise par deux.</desc>
<rect width="480" height="480" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#252a28"><text x="24" y="33" font-size="22" text-anchor="start" font-weight="700">Paires indépendantes : multiplier</text><text x="24" y="68" font-size="19" text-anchor="start">p(a) = 2/3 ; p(b) = 1/3</text><text x="299" y="105" font-size="17" text-anchor="middle">2e position</text><text x="212" y="137" font-size="18" text-anchor="middle">a : 2/3</text><text x="367" y="137" font-size="18" text-anchor="middle">b : 1/3</text><text x="65" y="197" font-size="17" text-anchor="middle">a : 2/3</text><rect x="135" y="155" width="155" height="75" fill="#f0f0ec" stroke="#252a28"/><text x="212" y="198" font-size="20" text-anchor="middle">aa : 4/9</text><rect x="290" y="155" width="155" height="75" fill="#f0f0ec" stroke="#252a28"/><text x="367" y="198" font-size="20" text-anchor="middle">ab : 2/9</text><text x="65" y="272" font-size="17" text-anchor="middle">b : 1/3</text><rect x="135" y="230" width="155" height="75" fill="#f0f0ec" stroke="#252a28"/><text x="212" y="273" font-size="20" text-anchor="middle">ba : 2/9</text><rect x="290" y="230" width="155" height="75" fill="#f0f0ec" stroke="#252a28"/><text x="367" y="273" font-size="20" text-anchor="middle">bb : 1/9</text><text x="24" y="344" font-size="18" text-anchor="start">Exemple : aaba → aa | ba → 0 | 110</text><text x="24" y="386" font-size="18" text-anchor="start">Moyenne sur tous les blocs :</text><text x="24" y="422" font-size="21" text-anchor="start" font-weight="700">17/9 bits/bloc ÷ 2 = 17/18</text><text x="24" y="453" font-size="18" text-anchor="start">bit par symbole initial</text></g></svg>
