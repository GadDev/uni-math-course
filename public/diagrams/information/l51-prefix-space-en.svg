<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Space occupied by a prefix</title><desc id="desc">0 reserves four positions; 10 and 11 two each. 0 and 01 overlap, so lengths alone do not prove decodability.</desc>
<rect width="480" height="490" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#252a28"><text x="24" y="33" font-size="21" text-anchor="start" font-weight="700">Prefixes reserve positions</text><text x="24" y="70" font-size="18" text-anchor="start">Depth M = 3: eight positions</text><rect x="24" y="102" width="54" height="45" fill="#fff" stroke="#252a28"/><text x="51" y="131" font-size="16" text-anchor="middle">000</text><rect x="78" y="102" width="54" height="45" fill="#fff" stroke="#252a28"/><text x="105" y="131" font-size="16" text-anchor="middle">001</text><rect x="132" y="102" width="54" height="45" fill="#fff" stroke="#252a28"/><text x="159" y="131" font-size="16" text-anchor="middle">010</text><rect x="186" y="102" width="54" height="45" fill="#fff" stroke="#252a28"/><text x="213" y="131" font-size="16" text-anchor="middle">011</text><rect x="240" y="102" width="54" height="45" fill="#fff" stroke="#252a28"/><text x="267" y="131" font-size="16" text-anchor="middle">100</text><rect x="294" y="102" width="54" height="45" fill="#fff" stroke="#252a28"/><text x="321" y="131" font-size="16" text-anchor="middle">101</text><rect x="348" y="102" width="54" height="45" fill="#fff" stroke="#252a28"/><text x="375" y="131" font-size="16" text-anchor="middle">110</text><rect x="402" y="102" width="54" height="45" fill="#fff" stroke="#252a28"/><text x="429" y="131" font-size="16" text-anchor="middle">111</text><rect x="24" y="163" width="216" height="48" fill="#f0f0ec" stroke="#252a28"/><text x="132.0" y="193" font-size="16" text-anchor="middle">0 : 4/8 = 1/2</text><rect x="240" y="163" width="108" height="48" fill="#f0f0ec" stroke="#252a28"/><text x="294.0" y="193" font-size="16" text-anchor="middle">10 : 2/8</text><rect x="348" y="163" width="108" height="48" fill="#f0f0ec" stroke="#252a28"/><text x="402.0" y="193" font-size="16" text-anchor="middle">11 : 2/8</text><text x="24" y="248" font-size="21" text-anchor="start" font-weight="700">K = 4/8 + 2/8 + 2/8 = 1</text><text x="24" y="290" font-size="18" text-anchor="start">A shorter word reserves more space.</text><text x="24" y="330" font-size="18" text-anchor="start" font-weight="700">Trap: 0 and 01 overlap.</text><rect x="24" y="350" width="216" height="35" fill="#f0f0ec" stroke="#252a28"/><text x="132" y="374" font-size="15" text-anchor="middle">0 → 000, 001, 010, 011</text><rect x="132" y="395" width="108" height="35" fill="#dddeda" stroke="#252a28"/><text x="186" y="419" font-size="14" text-anchor="middle">01 → 010, 011</text><line x1="159" y1="386" x2="159" y2="395" stroke="#252a28" stroke-width="2" stroke-dasharray="7 5"/><line x1="213" y1="386" x2="213" y2="395" stroke="#252a28" stroke-width="2" stroke-dasharray="7 5"/><text x="24" y="465" font-size="17" text-anchor="start">K ≤ 1 does not validate a given table.</text></g></svg>
