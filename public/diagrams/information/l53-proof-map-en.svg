<svg xmlns="http://www.w3.org/2000/svg" width="480" height="475" viewBox="0 0 480 475" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Combine McMillan and Gibbs</title><desc id="desc">McMillan bounds K. Normalizing the weights supplies a distribution q to Gibbs, giving H ≤ L + log2 K ≤ L.</desc>
<rect width="480" height="475" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#252a28"><text x="24" y="33" font-size="23" text-anchor="start" font-weight="700">Two tools, one lower bound</text><rect x="24" y="65" width="206" height="85" fill="#f0f0ec" stroke="#252a28"/><text x="127" y="94" font-size="20" text-anchor="middle" font-weight="700">McMillan</text><text x="127" y="128" font-size="17" text-anchor="middle">0 &lt; K ≤ 1</text><rect x="250" y="65" width="206" height="85" fill="#f0f0ec" stroke="#252a28"/><text x="353" y="94" font-size="20" text-anchor="middle" font-weight="700">Gibbs</text><text x="353" y="128" font-size="17" text-anchor="middle">H ≤ −Σ pᵢ log₂ qᵢ</text><line x1="127" y1="150" x2="180" y2="188" stroke="#252a28" stroke-width="2"/><line x1="353" y1="150" x2="300" y2="188" stroke="#252a28" stroke-width="2"/><rect x="46" y="188" width="388" height="95" fill="#f0f0ec" stroke="#252a28"/><text x="240" y="221" font-size="18" text-anchor="middle" font-weight="700">Normalize to use Gibbs</text><text x="240" y="255" font-size="18" text-anchor="middle">qᵢ = 2^(−ℓᵢ) / K ; Σ qᵢ = 1</text><line x1="240" y1="283" x2="240" y2="314" stroke="#252a28" stroke-width="2"/><rect x="24" y="314" width="432" height="65" fill="#f0f0ec" stroke="#252a28"/><text x="240" y="355" font-size="24" text-anchor="middle" font-weight="700">H ≤ L + log₂ K ≤ L</text><text x="24" y="414" font-size="18" text-anchor="start">The “+” matters: log₂ K ≤ 0.</text><text x="24" y="448" font-size="18" text-anchor="start">Equality H = L: K = 1 and p = q.</text></g></svg>
