<svg xmlns="http://www.w3.org/2000/svg" width="480" height="445" viewBox="0 0 480 445" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Pondérer avant d’additionner</title><desc id="desc">Les surprises 1, 2, 2 deviennent trois contributions de un demi bit. Leur somme vaut 1,5 bit par symbole.</desc>
<rect width="480" height="445" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#252a28"><text x="24" y="33" font-size="22" text-anchor="start" font-weight="700">De la surprise à sa moyenne</text><text x="24" y="72" font-size="18" text-anchor="start">p = (1/2, 1/4, 1/4)</text><text x="30" y="112" font-size="16" text-anchor="start" font-weight="700">Symbole</text><text x="150" y="112" font-size="16" text-anchor="start" font-weight="700">p</text><text x="250" y="112" font-size="16" text-anchor="start" font-weight="700">I = −log₂ p</text><text x="380" y="112" font-size="16" text-anchor="start" font-weight="700">p × I</text><line x1="24" y1="160" x2="456" y2="160" stroke="#252a28" stroke-width="2"/><text x="50" y="145" font-size="20" text-anchor="start">x</text><text x="150" y="145" font-size="20" text-anchor="start">1/2</text><text x="275" y="145" font-size="20" text-anchor="start">1</text><text x="400" y="145" font-size="20" text-anchor="start">1/2</text><line x1="24" y1="205" x2="456" y2="205" stroke="#252a28" stroke-width="2"/><text x="50" y="190" font-size="20" text-anchor="start">y</text><text x="150" y="190" font-size="20" text-anchor="start">1/4</text><text x="275" y="190" font-size="20" text-anchor="start">2</text><text x="400" y="190" font-size="20" text-anchor="start">1/2</text><line x1="24" y1="250" x2="456" y2="250" stroke="#252a28" stroke-width="2"/><text x="50" y="235" font-size="20" text-anchor="start">z</text><text x="150" y="235" font-size="20" text-anchor="start">1/4</text><text x="275" y="235" font-size="20" text-anchor="start">2</text><text x="400" y="235" font-size="20" text-anchor="start">1/2</text><text x="24" y="285" font-size="17" text-anchor="start">Contributions : même échelle en bits</text><rect x="24" y="304" width="144" height="42" fill="#f3f3ee" stroke="#252a28"/><text x="96" y="331" font-size="18" text-anchor="middle">x: 1/2</text><rect x="168" y="304" width="144" height="42" fill="#dddeda" stroke="#252a28"/><text x="240" y="331" font-size="18" text-anchor="middle">y: 1/2</text><rect x="312" y="304" width="144" height="42" fill="#c8cbc6" stroke="#252a28"/><text x="384" y="331" font-size="18" text-anchor="middle">z: 1/2</text><text x="24" y="385" font-size="21" text-anchor="start" font-weight="700">H = 1/2 + 1/2 + 1/2 = 3/2</text><text x="24" y="416" font-size="18" text-anchor="start">bits par symbole source</text></g></svg>
