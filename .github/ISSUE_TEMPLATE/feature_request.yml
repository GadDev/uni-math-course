name: Feature request
description: Suggest an improvement to learning or maintenance.
title: "[Idea]: "
body:
  - type: textarea
    id: need
    attributes:
      label: Learner or maintainer need
      description: Explain the problem before suggesting a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful solution
      description: Include alternatives and how success could be checked.
    validations:
      required: true
