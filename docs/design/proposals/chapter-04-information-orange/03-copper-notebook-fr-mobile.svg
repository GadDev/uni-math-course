<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 850" width="390" height="850" role="img" aria-labelledby="title desc"><title id="title">Copper Notebook French mobile</title><desc id="desc">Original static design proposal for Chapter 4 information theory, for design review only</desc><rect x="0" y="0" width="390" height="850" fill="#FCF6EC" stroke="none"/><rect x="0" y="0" width="390" height="65" fill="#FCF6EC" stroke="none"/><path d="M0 64L390 64" stroke="#261C18" stroke-width="1" fill="none"/><text x="22" y="42" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing="2">UNI MATH</text><text x="311" y="40" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >FR / EN</text><rect x="0" y="65" width="390" height="110" fill="#F5E0CD" stroke="none"/><text x="20" y="167" fill="#CA754B" font-family="Arial,Helvetica,sans-serif" font-size="98" font-weight="800" >04</text><text x="155" y="103" fill="#783C27" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="800" >CHAPITRE 04  /  THÉORIE DE L’INFORMATION</text><text x="22" y="218" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" >De l’information</text><text x="22" y="266" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800" >à l’entropie.</text><text x="22" y="309" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" >Comment représenter, transmettre et compresser</text><text x="22" y="331" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" >une information sans en perdre le sens ?</text><rect x="22" y="356" width="330" height="52" fill="#261C18" stroke="none"/><text x="35" y="389" fill="#FCF6EC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" >DÉCOUVRIR LE CHAPITRE</text><rect x="22" y="439" width="341" height="209" fill="#FCF6EC" stroke="#CA754B"/><text x="42" y="483" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" >H(S) = - SUM p log2 p</text><rect x="45" y="611" width="27" height="30" fill="#CA754B" stroke="none"/><rect x="93" y="596" width="27" height="45" fill="#CA754B" stroke="none"/><rect x="141" y="581" width="27" height="60" fill="#CA754B" stroke="none"/><rect x="189" y="566" width="27" height="75" fill="#CA754B" stroke="none"/><rect x="237" y="551" width="27" height="90" fill="#CA754B" stroke="none"/><rect x="285" y="536" width="27" height="105" fill="#CA754B" stroke="none"/><path d="M22 697L367 697" stroke="#261C18" stroke-width="1" fill="none"/><text x="22" y="732" fill="#783C27" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" >LE PARCOURS</text><text x="22" y="777" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" >01  Bits et messages</text><text x="22" y="815" fill="#261C18" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" >02  Les codages</text></svg>
