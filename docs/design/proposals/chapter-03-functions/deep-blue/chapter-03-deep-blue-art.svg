<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 03 — Function Mosaic / Deep Blue</title>
  <desc id="desc">A four-by-four modular Signal composition with blue and black circles, triangles, quarter-arcs and a rising dotted sequence. Inspired by the geometric grammar of the Ember Signal artwork in PR 105, with original tile placement.</desc>
<rect width="560" height="560" fill="#F4F4EF" />
<!-- Row 01: shape and output -->
<path d="M0 0H140V140H0Z" fill="#1455C0" />
<path d="M0 140A140 140 0 0 1 140 0H0Z" fill="#F4F4EF" />
<path d="M140 0H280V140H140Z" fill="#111111" />
<circle cx="350" cy="70" r="70" fill="#1455C0" />
<path d="M420 0H560V140H420Z" fill="#1455C0" />
<path d="M420 0A140 140 0 0 1 560 140H420Z" fill="#111111" />
<!-- Row 02: change -->
<path d="M0 140H140V280H0Z" fill="#111111" />
<path d="M0 140A140 140 0 0 1 140 280H0Z" fill="#1455C0" />
<path d="M140 140H280V280H140Z" fill="#1455C0" />
<path d="M140 280L280 140V280Z" fill="#F4F4EF" />
<path d="M280 140H420V280H280Z" fill="#111111" />
<path d="M280 280A140 140 0 0 1 420 140V280Z" fill="#1455C0" />
<circle cx="490" cy="210" r="70" fill="#1455C0" />
<!-- Row 03: values -->
<circle cx="70" cy="350" r="70" fill="#111111" />
<path d="M140 280H280V420H140Z" fill="#1455C0" />
<path d="M140 280A140 140 0 0 1 280 420H140Z" fill="#F4F4EF" />
<circle cx="350" cy="350" r="70" fill="#1455C0" />
<path d="M420 280H560V420H420Z" fill="#111111" />
<path d="M420 420A140 140 0 0 1 560 280V420Z" fill="#F4F4EF" />
<!-- Row 04: input and progression -->
<path d="M0 420H140V560H0Z" fill="#111111" />
<path d="M0 560A140 140 0 0 1 140 420V560Z" fill="#1455C0" />
<circle cx="210" cy="490" r="70" fill="#1455C0" />
<path d="M280 420H420V560H280Z" fill="#111111" />
<path d="M280 560L420 420H420V560Z" fill="#1455C0" />
<path d="M420 420H560V560H420Z" fill="#1455C0" />
<path d="M420 420A140 140 0 0 1 560 560H420Z" fill="#111111" />
<!-- Grid and a dashed rising sequence of sampled values -->
<path
  d="M0 140H560M0 280H560M0 420H560M140 0V560M280 0V560M420 0V560"
  fill="none"
  stroke="#111111"
  stroke-width="1"
/>
<path
  d="M32 506L190 365L339 216L505 50"
  fill="none"
  stroke="#111111"
  stroke-width="1.8"
  stroke-dasharray="5 8"
/>
<path
  d="M190 365V420M339 216V280"
  fill="none"
  stroke="#111111"
  stroke-width="1.4"
  stroke-dasharray="5 6"
/>
<circle cx="32" cy="506" r="7" fill="#F4F4EF" stroke="#111111" stroke-width="2" />
<circle cx="190" cy="365" r="7" fill="#111111" stroke="#F4F4EF" stroke-width="2" />
<circle cx="339" cy="216" r="7" fill="#F4F4EF" stroke="#111111" stroke-width="2" />
<circle cx="505" cy="50" r="7" fill="#F4F4EF" stroke="#111111" stroke-width="2" />
</svg>
