    main{min-width:0}.breadcrumb{font-size:12px;color:var(--muted);display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}.breadcrumb a{text-decoration:none}h1{font:normal 48px/1.13 Georgia,'DejaVu Serif',serif;letter-spacing:-1.7px;margin:0 0 16px;max-width:800px}h2{font:normal 28px/1.2 Georgia,'DejaVu Serif',serif;letter-spacing:-.5px;margin:0 0 15px}h3{font-size:17px;line-height:1.4;margin:0 0 9px}p{margin:0 0 16px}.lead{font-size:17px;line-height:1.65;color:var(--muted);max-width:700px;margin-bottom:24px}.meta{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--muted);margin-bottom:26px}.pill{font-size:11px;border:1px solid var(--line);padding:3px 9px;border-radius:99px;color:var(--teal);background:var(--surface);font-weight:bold}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid var(--teal);border-radius:9px;min-height:46px;padding:10px 18px;background:var(--teal);color:white;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:bold}.btn.secondary{background:var(--surface);color:var(--teal);border-color:var(--line)}.btn.quiet{background:none;border-color:transparent;color:var(--teal);padding-left:0}.arrow{font-size:19px;font-weight:normal}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:22px}.label{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:bold;margin-bottom:12px}.math{font-family:'DejaVu Serif',Georgia,serif;font-size:30px;letter-spacing:.3px;line-height:1.6}.formula{padding:24px 28px;background:var(--teal-soft);border-radius:12px;margin:18px 0}.reading{font-size:14px;color:var(--muted);margin-top:6px}.callout{padding:17px 20px;border-left:3px solid var(--teal);background:var(--teal-soft);border-radius:0 10px 10px 0;margin:20px 0;font-size:14px}.callout strong{display:block;margin-bottom:4px}.c ;color:var(--teal);margin-right:14px}.gate .btn{width:100%;margin:7px 0}.gate .fine{text-align:left;margin-top:22px}.gate .callout{text-align:left}.footer{border-top:1px solid var(--line);padding:20px 64px;display:flex;justify-content:space-between;gap:16px;font-size:11px;color:var(--muted);flex-wrap:wrap}.footer a{color:var(--muted)}.focus-example{outline:3px solid var(--focus);outline-offset:4px}.review-card{background:var(--teal-soft);border:0}.review-card p{font-size:14px}.note-title{font-family:Georgia,serif;font-size:22px}.page-cap{display:flex;align-items:center;gap:12px;margin-bottom:18px}.page-cap .pill{margin:0}

ey span{padding:5px 6px}.step-list li{gap:12px}.attempt{align-items:flex-start;flex-wrap:wrap}.focus-example{outline-width:3px}}

<body>
  <div id="app"></div>
  <script>
    // Presentation fixture only. No authentication, grading, persistence or network requests.
    const params=new URLSearchParams(location.search);
    const screen=params.get('screen')||'overview';
    const en=params.get('lang')==='en';
    const t=(fr,eng)=>en?eng:fr;
    document.documentElement.lang=en?'en':'fr';
    const privateScreen=['practice','feedback','progress'].includes(screen);
    const href=(s)=>'?screen='+s+'&lang='+(en?'en':'fr');
    const link=(s,label,cls='')=>`<a class="${cls}" href="${href(s)}">${label}</a>`;
    const button=(s,label,secondary=false)=>link(s,label+' <span class="arrow" aria-hidden="true">→</span>','btn'+(secondary?' secondary':''));
    const formula=(content,reading)=>`<div class="formula"><div class="math">${content==='P ⇒ Q'?'<math xmlns="http://www.w3.org/1998/Math/MathML"><mi>P</mi><mo>⇒</mo><mi>Q</mi></math>':content}</div><div class="reading">${reading}</div></div>`;
    const source=()=>`<div class="source">${t('Texte et exemples originaux pour cette proposition. Repère du cours : PDF pp. 20–23, selon la feuille de route.','Original text and examples for this proposal. Course locator: PDF pp. 20–23, as mapped in the roadmap.')}<br>${t('Le PDF n’a pas été inspecté pour cette proposition ; correspondance à vérifier avant publication.','The PDF was not inspected for this proposal; verify alignment before publication.')}</div>`;
    const breadcrumb=(end)=>`<div class="breadcrumb">${link('overview',t('Le cours','Course'))}<span>/</span><span>${t('Logique','Logic')}</span><span>/</span><span>${end}</span></div>`;
    const pageTitle=(tag,title,lead)=>`<div class="eyebrow">${tag}</div><h1>${title}</h1><p class="lead">${lead}</p>`;
    const metadata=()=>`<div class="meta"><span class="pill">${t('Couverture du cours','Course coverage')}</span><span>${t('Lecture · 8 min','Reading · 8 min')}</span><span>${t('Prérequis : assertions, tables de vérité','Prerequisites: assertions, truth tables')}</span></div>`;
    const truth=(highlight=true)=>`<table class="truth"><caption>${t('Quatre cas possibles · V = vrai, F = faux','Four possible cases · V = true, F = false')}</caption><thead><tr><th scope="col">P</th><th scope="col">Q</th><th scope="col">P ⇒ Q</th></tr></thead><tbody><tr><td>V</td><td>V</td><td>${t('Vrai','True')}</td></tr><tr class="${highlight?'false-row':''}"><td>V</td><td>F</td><td>${t('Faux · seul cas','False · only case')}</td></tr><tr><td>F</td><td>V</td><td>${t('Vrai','True')}</td></tr><tr><td>F</td><td>F</td><td>${t('Vrai','True')}</td></tr></tbody></table>`;
    const header=`<a class="skip" href="#main">${t('Aller au contenu','Skip to content')}</a><header><a class="brand" href="${href('overview')}"><span class="mark" aria-hidden="true">∴</span>Uni Math</a><nav aria-label="${t('Navigation principale','Main navigation')}">${link('overview',t('Le cours','Course'))}${link('glossary',t('Glossaire','Glossary'))}${link(privateScreen?'progress':'gate',t('Mon parcours','My learning'))}</nav><div class="actions"><div class="languages" role="group" aria-label="${t('Langue de lecture','Reading language')}"><button type="button" lang="fr" aria-label="Français" aria-pressed="${!en}" data-lang="fr">FR</button><button type="button" lang="en" aria-label="English" aria-pressed="${en}" data-lang="en">EN</button></div>${privateScreen?`<a class="account" href="${href('progress')}"><span class="avatar" aria-hidden="true">U</span>${t('Mon espace','My space')}</a>`:link('gate',t('Se connecter','Sign in'),'account')}</div></header><div class="preview"><span>${t('PROPOSITION DE DESIGN · CONTENU ORIGINAL · DONNÉES FICTIVES','DESIGN PROPOSAL · ORIGINAL CONTENT · FICTIONAL DATA')}</span><span>${t('Logique & ensembles / Semestre 3','Logic & sets / Semester 3')}</span></div>`;
    const sidebar=`<aside class="sidebar" aria-label="${t('Plan du cours','Course outline')}"><div class="eyebrow">${t('Votre point de départ','Your starting point')}</div><h2>${t('Logique & ensembles','Logic & sets')}</h2><ul class="outline"><li>${link('overview',`<small>01</small>${t('Assertions','Assertions')}`)}</li><li>${link('overview',`<small>02</small>${t('Connecteurs logiques','Logical connectives')}`)}</li><li>${link('overview',`<small>03</small>${t('Tables de vérité','Truth tables')}`)}</li><li><a href="${href('lesson')}" ${['lesson','worked','practice','feedback'].includes(screen)?'aria-current="page"':''}><small>05</small>${t('Implication','Implication')}</a></li></ul><div class="side-note"><strong>${t('À votre rythme','At your own pace')}</strong><p>${t('Une idée, un exemple, puis une occasion de l’essayer.','One idea, one example, then a chance to try it.')}</p>${link('glossary',t('Un symbole vous échappe ?','Need help with a symbol?'),'small-link')}</div><div class="side-note"><strong>${t('La suite du cours','Later in the course')}</strong><p>${t('Ensembles et quantificateurs : leçons à venir.','Sets and quantifiers: upcoming lessons.')}</p><span class="pill">${t('Non publié','Unpublished')}</span></div></aside>`;
    function overview(){return `${breadcrumb(t('Vue d’ensemble','Overview'))}${pageTitle(t('Un cours, pas à pas','One course, step by step'),t('Retrouver le fil\ndes mathématiques.','Find your way back\nto mathematics.'),t('Comprendre les symboles, construire un raisonnement, apprendre de ses erreurs. Commencez par une idée à la fois.','Understand symbols, build an argument, learn from mistakes. Start with one idea at a time.'))}<div class="row stack">${button('lesson',t('Découvrir l’implication','Explore implication'))}${link('glossary',t('Explorer les symboles','Explore the symbols'),'btn secondary')}</div><div class="callout"><strong>${t('Lire est ouvert à tous.','Reading is open to everyone.')}</strong>${t('Les leçons, exemples et le glossaire sont accessibles sans compte. Connectez-vous pour pratiquer et retrouver vos réponses.','Lessons, examples and the glossary need no account. Sign in to practise and return to your responses.')}</div><div class="row between stack"><h2 style="margin:0">${t('Les premières idées','The first ideas')}</h2><span class="fine">${t('4 leçons proposées · pilote','4 proposed lessons · pilot')}</span></div><div class="course-grid">${[['01','Assertions','Assertions','Reconnaître ce qui peut être vrai ou faux.','Recognise what can be true or false.'],['02','Connecteurs logiques','Logical connectives','Relier deux assertions sans perdre leur sens.','Connect assertions without losing their meaning.'],['03','Tables de vérité','Truth tables','Examiner tous les cas, méthodiquement.','Examine every case, methodically.'],['05','Implication','Implication','Comprendre ce que « si… alors… » affirme.','Understand what “if… then…” asserts.']].map(x=>`<article class="topic"><span class="pill">${t(x[0]==='05'?'Aperçu disponible':'À concevoir',x[0]==='05'?'Preview available':'To be designed')}</span><div class="number">${x[0]}</div><h3>${t(x[1],x[2])}</h3><p>${t(x[3],x[4])}</p>${x[0]==='05'?link('lesson',t('Lire la proposition →','Read the proposal →')):`<span class="fine">${t('Prérequis et contenu à valider','Prerequisites and content to validate')}</span>`}</article>`).join('')}</div><div class="journey"><span>${t('Comprendre','Understand')}</span>→<span>${t('Voir un exemple','See an example')}</span>→<span>${t('Pratiquer','Practise')}</span>→<span>${t('Revenir sur ses erreurs','Revisit mistakes')}</span></div>`}
    function lesson(){return `${breadcrumb(t('Implication','Implication'))}${pageTitle(t('Leçon 05 / Comprendre','Lesson 05 / Understand'),t('Que signifie\n« si… alors… » ?','What does\n“if… then…” mean?'),t('Une implication ne dit pas que tout est vrai. Elle précise le seul cas qui ne doit pas se produire.','An implication does not say that everything is true. It specifies the one case that must not occur.'))}${metadata()}<div class="card"><div class="label">${t('Avant de commencer','Before we start')}</div><p style="font-size:14px;margin:0">${t('P et Q sont des assertions. Chacune prend une valeur de vérité dans {V, F}. On étudie l’implication matérielle de la logique classique.','P and Q are assertions. Each has a truth value in {V, F}. We are studying material implication in classical logic.')}</p></div><div class="cols"><section class="card"><h2>${t('Une seule façon d’être fausse','Only one way to be false')}</h2>${formula('P ⇒ Q',t('Se lit : « si P, alors Q ».','Read as: “if P, then Q”.'))}<p style="font-size:14px">${t('L’implication est fausse lorsque P est vraie et Q est fausse. Dans les trois autres cas, elle est vraie.','The implication is false when P is true and Q is false. It is true in the other three cases.')}</p><div class="callout"><strong>${t('Condition suffisante, condition nécessaire','Sufficient condition, necessary condition')}</strong>${t('Dans « P implique Q », P est suffisante pour Q ; Q est nécessaire pour P. Cela ne permet pas de conclure « Q implique P ».','In “P implies Q”, P is sufficient for Q; Q is necessary for P. This does not establish “Q implies P”.')}</div></section><section class="card"><div class="label">${t('La table, pour vérifier','The table, to check')}</div>${truth()}<p class="fine" style="margin-top:15px;margin-bottom:0">${t('Quand P est fausse, ce seul fait ne réfute pas « si P, alors Q ».','When P is false, that alone does not refute “if P, then Q”.')}</p></section></div><div class="row between">${button('worked',t('Voir un exemple expliqué','See a worked example'))}${link('glossary',t('Relire les symboles','Review the symbols'),'small-link')}</div>${source()}`}
    function worked(){return `${breadcrumb(t('Exemple expliqué','Worked example'))}${pageTitle(t('Leçon 05 / Observer','Lesson 05 / Inspect'),t('Tester un cas concret.','Test a concrete case.'),t('Définissons d’abord les assertions. Puis vérifions chacune d’elles avant de juger l’implication.','Define the assertions first. Then check each one before evaluating the implication.'))}<div class="meta"><span class="pill">${t('Exemple original','Original example')}</span><span>${t('Guidé · sans note','Guided · ungraded')}</span></div><div class="card"><div class="label">${t('Domaine et hypothèses','Domain and assumptions')}</div><p style="font-size:14px">${t('n ∈ ℕ, avec ℕ = {0, 1, 2, …}. Pour cet exemple, n = 7.','n ∈ ℕ, with ℕ = {0, 1, 2, …}. In this example, n = 7.')}</p>${formula('P(n) : n ≥ 5',t('P(n) : « n est supérieur ou égal à cinq ».','P(n): “n is greater than or equal to five”.'))}<p class="math" style="font-size:24px">Q(n) : ${t('« n est pair »','“n is even”')}</p></div><div class="card"><ol class="step-list"><li><span class="step-num">1</span><div><h3>${t('Vérifier P(7)','Check P(7)')}</h3><div class="math">7 ≥ 5 : ${t('vrai','true')}</div><p>${t('L’antécédent est vrai.','The antecedent is true.')}</p></div></li><li><span class="step-num">2</span><div><h3>${t('Vérifier Q(7)','Check Q(7)')}</h3><p>${t('7 est impair : Q(7) est fausse.','7 is odd: Q(7) is false.')}</p></div></li><li><span class="step-num">3</span><div><h3>${t('Comparer avec la table','Compare with the table')}</h3><div class="math">V ⇒ F : ${t('faux','false')}</div><p>${t('Ce cas réfute la proposition universelle « pour tout n ∈ ℕ, si n ≥ 5, alors n est pair ».','This case refutes the universal statement “for every n ∈ ℕ, if n ≥ 5, then n is even”.')}</p></div></li></ol></div><div class="row">${button('gate',t('Essayer un exercice','Try an exercise'))}${button('lesson',t('Revenir à la leçon','Return to the lesson'),true)}</div><p class="fine" style="margin-top:13px">${t('La pratique interactive nécessite une connexion.','Interactive practice requires sign-in.')}</p>${source()}`}
    function glossary(){const entries=[['⇒','Implication','Implication','« si P, alors Q »','“if P, then Q”','Une assertion construite à partir de P et Q.','An assertion formed from P and Q.'],['↔','Biconditionnelle','Biconditional','« P si et seulement si Q »','“P if and only if Q”','À distinguer de deux formules ayant la même table de vérité.','Distinct from two formulas having the same truth table.'],['∈','Appartenance','Membership','« appartient à »','“is an element of”','Relie un élément à un ensemble : 2 ∈ ℕ.','Relates an element to a set: 2 ∈ ℕ.'],['⊆','Inclusion','Inclusion','« est inclus dans »','“is a subset of”','Relie deux ensembles : {0, 1} ⊆ ℕ.','Relates two sets: {0, 1} ⊆ ℕ.'],['ℕ','Nombres naturels','Natural numbers','« ensemble des nombres naturels »','“set of natural numbers”','Convention du cours : {0, 1, 2, …}.','Course convention: {0, 1, 2, …}.'],[']0; 1]','Intervalle semi-ouvert','Half-open interval','« de zéro exclu à un inclus »','“from zero excluded to one included”','x réel tel que 0 < x ≤ 1. Notation française conservée.','Real x such that 0 < x ≤ 1. French notation preserved.']];return `${breadcrumb(t('Glossaire','Glossary'))}${pageTitle(t('Un symbole, deux langues','One symbol, two languages'),t('Lire les mathématiques.','Read mathematics.'),t('Le sens reste le même. La façon de le lire change avec la langue.','The meaning stays the same. The way you read it changes with the language.'))}<div class="search"><label for="search">${t('Chercher un symbole ou un concept','Find a symbol or concept')}</label><input id="search" type="search" placeholder="${t('Ex. : implication, ∈, intervalle','E.g. implication, ∈, interval')}" aria-describedby="search-help"><p class="fine" id="search-help" style="margin-top:7px">${t('Aperçu : 6 entrées originales. Le glossaire complet reste à rédiger.','Preview: 6 original entries. The complete glossary is still to be authored.')}</p></div><div class="card">${entries.map((x,i)=>`<article class="glossary-item"><div class="symbol" aria-hidden="true">${x[0]}</div><div><div class="label">${i<2?t('Couverture du cours · logique','Course coverage · logic'):i<4?t('Couverture du cours · leçon à venir','Course coverage · upcoming lesson'):t('Repère préalable','Prerequisite support')}</div><div class="bilingual"><section lang="fr"><div class="locale-label">FRANÇAIS</div><h3>${x[1]}</h3><p>${x[3]}</p><p>${x[5]}</p></section><section lang="en"><div class="locale-label">ENGLISH</div><h3>${x[2]}</h3><p>${x[4]}</p><p>${x[6]}</p></section></div></div></article>`).join('')}</div><div class="callout warning"><strong>${t('Note de source · quantificateurs','Source note · quantifiers')}</strong>${t('L’exemple d’âge strict de la page PDF 48 est signalé comme problématique dans la constitution. Aucun exercice noté n’en est dérivé ici.','The strict-age example on PDF page 48 is flagged as problematic in the constitution. No graded exercise here is derived from it.')}</div><p class="fine">${t('Repères de pages issus de la feuille de route ; vérification directe du PDF à faire.','Page locators come from the roadmap; direct PDF verification is still required.')}</p>`}
    function exerciseForm(answered=false){const opts=[['both-true','V','V'],['true-false','V','F'],['false-true','F','V'],['both-false','F','F']];return `<div class="exercise-head"><span class="pill">${t('Reconnaître un cas','Recognise a case')}</span><span class="fine">${t('Exercice original · version 1','Original exercise · version 1')}</span></div><div class="exercise-prompt">${t('Dans quel cas P ⇒ Q est-elle fausse ?','In which case is P ⇒ Q false?')}</div><p class="exercise-domain">${t('P et Q sont deux assertions indépendantes. Chacune prend une valeur dans {V, F} : V = vrai, F = faux.','P and Q are independent assertions. Each takes a value in {V, F}: V = true, F = false.')}</p><fieldset class="options"><legend>${answered?t('Votre réponse','Your response'):t('Choisissez une seule réponse','Choose one response')}</legend>${opts.map((x,i)=>`<label class="option ${answered&&i===2?'selected':''}"><input type="radio" name="answer" value="${x[0]}" ${answered&&i===2?'checked':''} ${answered?'disabled':''}><span><code>P : ${x[1]} &nbsp; Q : ${x[2]}</code></span>${answered&&i===2?`<span class="answer-result">${t('À revoir','Review')}</span>`:`<span class="option-letter" aria-hidden="true">${'ABCD'[i]}</span>`}</label>`).join('')}</fieldset>`}
    function practice(){return `${breadcrumb(t('Pratique','Practice'))}${pageTitle(t('Leçon 05 / Pratiquer','Lesson 05 / Practise'),t('À vous de raisonner.','Your turn to reason.'),t('Prenez le temps de distinguer l’antécédent de la conséquence. Un indice est disponible si vous en avez besoin.','Take time to distinguish the antecedent from the consequent. A hint is available if you need it.'))}<div class="meta"><span>${t('Difficulté : initiation','Difficulty: introductory')}</span><span>${t('Prérequis : lire une table de vérité','Prerequisite: reading a truth table')}</span></div><form class="card" id="exercise">${exerciseForm()}<div class="hint-row"><button type="button" id="hint" aria-controls="hint-content" aria-expanded="false">${t('Afficher un indice','Show a hint')}</button><p class="fine">${t('Facultatif · votre choix','Optional · your choice')}</p></div><div class="callout" id="hint-content" hidden>${t('Cherchez le cas où P est vraie mais Q ne l’est pas. Une réponse aidée reste utile pour apprendre, mais ne compte pas comme preuve indépendante.','Look for the case where P is true but Q is not. A hinted response still helps learning but does not count as independent evidence.')}</div><div class="submit-row"><button class="btn" id="submit" type="submit" disabled>${t('Vérifier ma réponse','Check my response')}</button><p class="fine">${t('Choisissez une réponse pour continuer.','Choose a response to continue.')}</p></div></form><div class="row between">${link('worked',t('Revoir l’exemple expliqué','Revisit the worked example'),'small-link')}<span class="fine">${t('Pas de chronomètre. Pas de classement.','No timer. No ranking.')}</span></div>${source()}`}
    function feedback(){return `${breadcrumb(t('Retour sur la réponse','Response feedback'))}${pageTitle(t('Leçon 05 / Comprendre son erreur','Lesson 05 / Learn from a mistake'),t('Le bon endroit pour\nrevoir son raisonnement.','A good moment to\nrevisit your reasoning.'),t('Une réponse à revoir est une occasion de préciser une idée. Regardons ce qui change lorsque P est fausse.','A response to review is a chance to clarify an idea. Let’s look at what changes when P is false.'))}<div class="cols"><div><div class="card">${exerciseForm(true)}<p class="fine" style="margin-top:16px">${t('Réponse envoyée · aucun indice utilisé','Submitted response · no hint used')}</p></div></div><div><section class="feedback" role="status" aria-live="polite" aria-atomic="true"><div class="label">${t('À revoir · implication','Review · implication')}</div><h2>${t('P fausse ne rend pas\nl’implication fausse.','A false P does not make\nthe implication false.')}</h2><div class="answer-summary">${t('Votre choix : P fausse, Q vraie.','Your choice: P false, Q true.')}<br><strong>${t('Dans ce cas, P ⇒ Q est vraie.','In this case, P ⇒ Q is true.')}</strong></div><p>${t('Vous avez peut-être attribué la valeur de P à toute l’implication. Or, seul le cas P vraie et Q fausse la réfute.','You may have assigned P’s truth value to the whole implication. Only the case where P is true and Q is false refutes it.')}</p><div class="math">V ⇒ F : ${t('faux','false')}</div><p style="margin-top:12px">${t('Pour réparer le raisonnement : vérifiez P, puis Q, et cherchez la ligne correspondante dans la table.','To repair the reasoning: check P, then Q, and find the corresponding row in the table.')}</p></section><div class="card"><div class="label">${t('Le repère à garder','The idea to keep')}</div>${truth()}</div></div></div><div class="row">${button('practice',t('Réessayer cet exercice','Retry this exercise'))}${button('progress',t('Retrouver mes révisions','View my reviews'),true)}</div><p class="fine" style="margin-top:15px">${t('La correction est révélée. Un nouvel essai sur cet item ne sera pas une preuve indépendante de maîtrise.','The solution is revealed. A retry on this item will not be independent evidence of mastery.')}</p>${source()}`}
    function progress(){return `${breadcrumb(t('Mon parcours','My learning'))}${pageTitle(t('Espace privé / Données fictives','Private space / Fictional data'),t('Avancer, puis revenir\nsur ce qui résiste.','Move forward, then revisit\nwhat needs more work.'),t('Lire, essayer et comprendre sont trois étapes différentes. Votre parcours les distingue.','Reading, trying and understanding are different steps. Your learning record keeps them separate.'))}<div class="stats"><section class="stat"><h3>${t('Lecture terminée','Reading completed')}</h3><div class="value">2 / 4</div><p>${t('Leçons marquées comme lues.','Lessons marked as read.')}</p></section><section class="stat"><h3>${t('Historique des essais','Attempt history')}</h3><div class="value">8</div><p>${t('Essais, dont 2 avec indice.','Attempts, including 2 with hints.')}</p></section><section class="stat"><h3>${t('Maîtrise · proposition','Mastery · proposal')}</h3><div class="value">3 / 5</div><p>${t('Réponses correctes indépendantes.','Correct independent responses.')}</p></section></div><div class="callout"><strong>${t('Un repère à évaluer, pas une certification.','A heuristic to evaluate, not a certification.')}</strong>${t('Proposition : 4 réponses correctes sur les 5 dernières éligibles, sur deux sessions et des items distincts, dont une application. Ici, ce repère n’est pas atteint.','Proposal: 4 correct responses among the last 5 eligible responses, across two sessions and distinct items, including an application item. Here, the criterion is not met.')}</div><div class="cols"><section class="card review-card"><div class="eyebrow">${t('Une idée à revisiter','An idea to revisit')}</div><h2>${t('Quand P est fausse','When P is false')}</h2><p>${t('Revenez sur l’implication, puis essayez une question différente pour voir si l’idée tient.','Revisit implication, then try a different question to check your understanding.')}</p>${button('feedback',t('Relire mon erreur','Review my mistake'))}<p class="fine" style="margin:15px 0 0">${t('Même item : révision uniquement. Nouvel item : à rédiger.','Same item: review only. Fresh item: still to be authored.')}</p></section><section class="card"><h2>${t('Derniers essais','Recent attempts')}</h2><div class="attempt"><div><strong>${t('Implication · item 01','Implication · item 01')}</strong><p>${t('Aujourd’hui · version 1 · sans indice','Today · version 1 · without hint')}</p></div><span class="status error">${t('À revoir','Review')}</span></div><div class="attempt"><div><strong>${t('Table de vérité · item 02','Truth table · item 02')}</strong><p>${t('Aujourd’hui · exemple fictif','Today · fictional example')}</p></div><span class="status">${t('Correct · aidé','Correct · hinted')}</span></div><div class="attempt"><div><strong>${t('Implication · item 03','Implication · item 03')}</strong><p>${t('Hier · exemple fictif','Yesterday · fictional example')}</p></div><span class="status">${t('Correct','Correct')}</span></div><p class="fine" style="margin-top:16px;margin-bottom:0">${t('Les exemples d’historique ne constituent pas une banque d’exercices publiée.','These history examples are not a published exercise bank.')}</p></section></div><p class="fine">${t('Les questions aidées, révélées ou déjà vues ne comptent pas comme nouvelles preuves indépendantes. Les versions des essais sont conservées.','Hinted, revealed or already-seen questions do not count as fresh independent evidence. Attempt versions are retained.')}</p>`}
    function gate(){return `${breadcrumb(t('Accéder à la pratique','Access practice'))}<div class="gate"><div class="lock" aria-hidden="true">∴</div>${pageTitle(t('Lire librement, pratiquer dans son espace','Read freely, practise in your own space'),t('Un espace pour\nretrouver vos essais.','A space to\nreturn to your attempts.'),t('Connectez-vous pour pratiquer et conserver votre parcours. La lecture du cours reste ouverte à tous.','Sign in to practise and keep your learning record. Course reading remains open to everyone.'))}<div class="card"><ul><li>${t('Pratiquer avec des retours expliqués','Practise with explained feedback')}</li><li>${t('Retrouver ses réponses et ses erreurs','Return to your responses and mistakes')}</li><li>${t('Suivre son parcours de façon privée','Track your learning privately')}</li></ul><button class="btn" type="button" disabled aria-describedby="auth-note">${t('Se connecter · aperçu','Sign in · preview')}</button>${button('lesson',t('Continuer la lecture','Continue reading'),true)}<p class="fine" id="auth-note">${t('Écran proposé : la connexion n’est pas encore disponible. Le moyen de connexion reste à choisir.','Proposed screen: sign-in is not available yet. The sign-in method is still to be chosen.')}</p></div><div class="callout"><strong>${t('Avant l’ouverture aux utilisateurs','Before user access opens')}</strong>${t('Les modalités de conservation, de suppression et d’export des données doivent être définies. Aucun compte ni aucune réponse réelle n’est collecté dans cet aperçu.','Data retention, deletion and export terms must be defined. This preview collects no accounts or real responses.')}</div></div>`}
    const screens={overview,lesson,worked,glossary,practice,feedback,progress,gate};
    document.querySelector('#app').innerHTML=header+`<div class="layout">${sidebar}<main id="main"><div class="mobile-section"><span>${t('Logique & ensembles','Logic & sets')}</span>${link('overview',t('Plan du cours','Course outline'))}</div>${(screens[screen]||overview)()}</main></div><footer class="footer"><span>${t('Projet indépendant · Aucune affiliation universitaire revendiquée','Independent project · No university affiliation claimed')}</span><span>${t('Proposition visuelle · Aucun compte réel','Visual proposal · No real account')} · ${link('glossary',t('Aide à la notation','Notation help'))}</span></footer>`;
    for(const b of document.querySelectorAll('[data-lang]'))b.addEventListener('click',()=>{const lang=b.dataset.lang;const selection=document.querySelector('input[name=answer]:checked')?.value;params.set('lang',lang);if(selection)params.set('selected',selection);if(!document.querySelector('#hint-content')?.hidden&&document.querySelector('#hint-content'))params.set('hint','1');location.search=params.toString()});
    if(screen==='practice'){
      const selected=params.get('selected');if(selected){const r=document.querySelector(`input[value="${CSS.escape(selected)}"]`);if(r)r.checked=true;}
      const submit=document.querySelector('#submit');const update=()=>{submit.disabled=!document.querySelector('input[name=answer]:checked')};update();
      document.querySelector('#exercise').addEventListener('change',update);
      document.querySelector('#hint').addEventListener('click',()=>{document.querySelector('#hint-content').hidden=false;document.querySelector('#hint').setAttribute('aria-expanded','true');document.querySelector('#hint').textContent=t('Indice affiché','Hint shown')});
      if(params.get('hint')==='1')document.querySelector('#hint').click();
      document.querySelector('#exercise').addEventListener('submit',e=>{e.preventDefault();document.querySelector('.submit-row .fine').textContent=t('Aperçu visuel uniquement : aucune réponse n’est évaluée ni enregistrée.','Visual preview only: no response is graded or stored.')});
    }
    if(screen==='glossary')document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.toLocaleLowerCase();for(const row of document.querySelectorAll('.glossary-item'))row.hidden=!row.textContent.toLocaleLowerCase().includes(q)});
    if(params.get('focus')==='1')document.querySelector('#hint')?.classList.add('focus-example');
  </script>
</body>
